name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 and 11 are end-of-life with unpatched advisories, which Composer >= 2.9 refuses
          # to install by default. Apps still run them, so we keep testing against them.
          - { php: '8.1', laravel: '10.*', testbench: '8.*', eol: true }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', eol: true }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', eol: false }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', eol: false }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.eol && '1' || '' }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
